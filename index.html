<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#111418">
<title>Web HT</title>
<style>
  :root{
    --bg:#111418; --card:#1a1f26; --line:#2a313b; --text:#e8ecf1; --mute:#8b96a5;
    --accent:#34d399; --talk:#ef4444;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  body{display:flex;justify-content:center}
  .app{width:100%;max-width:440px;padding:20px 16px 28px;display:flex;flex-direction:column;gap:16px}
  h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.02em}
  h1 span{color:var(--accent)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
  label{display:block;font-size:12px;color:var(--mute);margin-bottom:6px}
  input[type=text]{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);
    background:#0f1317;color:var(--text);font-size:16px;outline:none}
  input[type=text]:focus{border-color:var(--accent)}
  .row{display:flex;gap:10px}
  .row>*{flex:1}
  .field+.field{margin-top:12px}
  button{font:inherit;cursor:pointer}
  .btn{padding:13px 14px;border-radius:10px;border:0;background:var(--accent);color:#06281c;font-weight:700;font-size:16px;width:100%}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text);font-weight:500}
  .hint{font-size:12px;color:var(--mute);margin:10px 0 0;line-height:1.5}
  .hidden{display:none!important}

  .status{display:flex;align-items:center;justify-content:space-between;font-size:14px}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--mute);margin-right:8px}
  .dot.on{background:var(--accent);box-shadow:0 0 8px var(--accent)}
  .chan{font-weight:700;letter-spacing:.08em}

  .ptt-wrap{display:flex;justify-content:center;padding:10px 0}
  #ptt{width:220px;height:220px;border-radius:50%;border:6px solid var(--line);background:#222932;color:var(--text);
    font-size:20px;font-weight:800;letter-spacing:.06em;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
    touch-action:none;user-select:none;-webkit-user-select:none;transition:transform .08s, background .1s, border-color .1s}
  #ptt small{font-size:12px;font-weight:500;color:var(--mute);letter-spacing:0}
  #ptt.talking{background:var(--talk);border-color:#fca5a5;transform:scale(.97);color:#fff}
  #ptt.talking small{color:#fee2e2}
  #ptt.rx{border-color:var(--accent)}

  .peers{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
  .peers li{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:10px;background:#0f1317;font-size:14px}
  .peers li.speaking{outline:1px solid var(--accent)}
  .peers .tag{font-size:11px;color:var(--accent);font-weight:700}
  .empty{color:var(--mute);font-size:13px;text-align:center;padding:6px}
  input[type=range]{width:100%;accent-color:var(--accent)}
  .err{color:#fca5a5;font-size:13px;margin-top:10px}
  .lockrow{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute);margin-top:12px}
</style>
</head>
<body>
<div class="app">
  <h1>WEB <span>HT</span></h1>

  <!-- Layar masuk -->
  <section id="join" class="card">
    <div class="field">
      <label for="name">Nama panggilan (opsional)</label>
      <input id="name" type="text" maxlength="20" placeholder="mis. Budi" autocomplete="off">
    </div>
    <div class="field">
      <label for="chan">Kode channel</label>
      <input id="chan" type="text" maxlength="30" placeholder="mis. keluarga123" autocomplete="off" autocapitalize="off" spellcheck="false">
    </div>
    <div class="field">
      <button id="joinBtn" class="btn">Masuk Channel</button>
    </div>
    <div id="joinErr" class="err hidden"></div>
    <p class="hint">Semua orang yang memasukkan kode channel yang sama akan terhubung. Pakai kode yang sulit ditebak
      kalau tidak ingin ada orang lain ikut masuk. Browser akan meminta izin mikrofon.</p>
  </section>

  <!-- Layar HT -->
  <section id="radio" class="hidden" style="display:flex;flex-direction:column;gap:16px">
    <div class="card status">
      <div><span id="dot" class="dot"></span><span id="statusTxt">Menghubungkan…</span></div>
      <div class="chan" id="chanLabel"></div>
    </div>

    <div class="ptt-wrap">
      <button id="ptt" aria-label="Tahan untuk bicara">
        <span id="pttTxt">TAHAN<br>UNTUK BICARA</span>
        <small>atau tahan tombol Spasi</small>
      </button>
    </div>

    <div class="card">
      <label>Anggota di channel</label>
      <ul id="peers" class="peers"></ul>
      <div id="peersEmpty" class="empty">Belum ada orang lain. Bagikan kode channel ke teman.</div>
    </div>

    <div class="card">
      <label for="vol">Volume</label>
      <input id="vol" type="range" min="0" max="1" step="0.05" value="1">
      <div class="lockrow">
        <input id="latch" type="checkbox">
        <label for="latch" style="margin:0">Mode kunci: ketuk sekali untuk bicara, ketuk lagi untuk berhenti</label>
      </div>
    </div>

    <button id="leaveBtn" class="btn ghost">Keluar Channel</button>
  </section>
</div>

<div id="audios"></div>

<script type="module">
import { joinRoom, selfId } from 'https://esm.sh/trystero@0.21.5/torrent';

const $ = id => document.getElementById(id);
const APP_ID = 'web-ht-sederhana-v1';

let room = null, micStream = null, micTrack = null;
let peers = new Map();            // id -> {name, talking}
let talking = false;
let sendState = null;
let myName = '';
let audioCtx = null;

// ----- Preferensi -----
try {
  $('name').value = localStorage.getItem('ht_name') || '';
  $('chan').value = location.hash.slice(1) ? decodeURIComponent(location.hash.slice(1)) : (localStorage.getItem('ht_chan') || '');
} catch {}

// ----- Bunyi "roger beep" -----
function beep(freq = 880, dur = 0.09) {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.frequency.value = freq; o.type = 'sine';
    g.gain.setValueAtTime(0.0001, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.25, audioCtx.currentTime + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    o.connect(g).connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur + 0.02);
  } catch {}
}

// ----- UI -----
function renderPeers() {
  const ul = $('peers'); ul.innerHTML = '';
  peers.forEach((p, id) => {
    const li = document.createElement('li');
    if (p.talking) li.classList.add('speaking');
    const n = document.createElement('span');
    n.textContent = p.name || ('Anggota ' + id.slice(0, 4));
    li.appendChild(n);
    if (p.talking) { const t = document.createElement('span'); t.className = 'tag'; t.textContent = 'BICARA'; li.appendChild(t); }
    ul.appendChild(li);
  });
  $('peersEmpty').classList.toggle('hidden', peers.size > 0);
  const anyRx = [...peers.values()].some(p => p.talking);
  $('ptt').classList.toggle('rx', anyRx && !talking);
  $('statusTxt').textContent = peers.size
    ? `Terhubung · ${peers.size + 1} orang`
    : 'Menunggu anggota lain…';
  $('dot').classList.toggle('on', peers.size > 0);
}

function showJoinError(msg) {
  const e = $('joinErr'); e.textContent = msg; e.classList.remove('hidden');
}

// ----- Masuk channel -----
$('joinBtn').addEventListener('click', async () => {
  $('joinErr').classList.add('hidden');
  const chan = $('chan').value.trim().toLowerCase().replace(/\s+/g, '-');
  if (!chan) return showJoinError('Isi kode channel dulu.');
  myName = $('name').value.trim();

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia)
    return showJoinError('Browser tidak mendukung mikrofon, atau halaman tidak dibuka lewat HTTPS.');

  try {
    micStream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
      video: false
    });
  } catch (e) {
    return showJoinError('Izin mikrofon ditolak. Aktifkan izin mikrofon untuk situs ini lalu coba lagi.');
  }
  micTrack = micStream.getAudioTracks()[0];
  micTrack.enabled = false; // mati sampai tombol ditekan

  try { localStorage.setItem('ht_name', myName); localStorage.setItem('ht_chan', chan); } catch {}
  history.replaceState(null, '', '#' + encodeURIComponent(chan));

  audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();

  startRoom(chan);
});

function startRoom(chan) {
  room = joinRoom({ appId: APP_ID }, chan);
  const [send, onState] = room.makeAction('state');
  sendState = send;

  $('chanLabel').textContent = '#' + chan;
  $('join').classList.add('hidden');
  $('radio').classList.remove('hidden');
  peers.clear(); renderPeers();

  room.onPeerJoin(id => {
    peers.set(id, { name: '', talking: false });
    room.addStream(micStream, id);          // kirim mic (dalam keadaan mute) ke anggota baru
    sendState({ name: myName, talking }, id);
    renderPeers();
  });

  room.onPeerLeave(id => {
    peers.delete(id);
    const el = document.getElementById('a-' + id);
    if (el) el.remove();
    renderPeers();
  });

  room.onPeerStream((stream, id) => {
    let el = document.getElementById('a-' + id);
    if (!el) {
      el = document.createElement('audio');
      el.id = 'a-' + id; el.autoplay = true; el.playsInline = true;
      $('audios').appendChild(el);
    }
    el.srcObject = stream;
    el.volume = parseFloat($('vol').value);
    el.play().catch(() => {});
  });

  onState((data, id) => {
    const p = peers.get(id) || { name: '', talking: false };
    const was = p.talking;
    p.name = (data && data.name) || p.name;
    p.talking = !!(data && data.talking);
    peers.set(id, p);
    if (!was && p.talking) beep(660, 0.07);
    if (was && !p.talking) beep(990, 0.07);
    renderPeers();
  });
}

// ----- Push to talk -----
function setTalking(on) {
  if (!room || on === talking) return;
  talking = on;
  micTrack.enabled = on;
  $('ptt').classList.toggle('talking', on);
  $('pttTxt').innerHTML = on ? 'BERBICARA…' : 'TAHAN<br>UNTUK BICARA';
  sendState({ name: myName, talking: on });
  if (on) beep(1200, 0.06); else beep(800, 0.06);
  renderPeers();
}

const ptt = $('ptt');
let pointerDown = false;
ptt.addEventListener('pointerdown', e => {
  e.preventDefault();
  if ($('latch').checked) { setTalking(!talking); return; }
  pointerDown = true; ptt.setPointerCapture(e.pointerId); setTalking(true);
});
const release = e => {
  if ($('latch').checked || !pointerDown) return;
  pointerDown = false; setTalking(false);
};
ptt.addEventListener('pointerup', release);
ptt.addEventListener('pointercancel', release);
ptt.addEventListener('contextmenu', e => e.preventDefault());

window.addEventListener('keydown', e => {
  if (e.code !== 'Space' || e.repeat || !room) return;
  if (document.activeElement && document.activeElement.tagName === 'INPUT') return;
  e.preventDefault();
  if ($('latch').checked) setTalking(!talking); else setTalking(true);
});
window.addEventListener('keyup', e => {
  if (e.code !== 'Space' || !room || $('latch').checked) return;
  setTalking(false);
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden && !$('latch').checked) setTalking(false);
});

// ----- Volume -----
$('vol').addEventListener('input', () => {
  document.querySelectorAll('#audios audio').forEach(a => a.volume = parseFloat($('vol').value));
});

// ----- Keluar -----
$('leaveBtn').addEventListener('click', () => {
  setTalking(false);
  if (room) room.leave();
  room = null;
  if (micStream) micStream.getTracks().forEach(t => t.stop());
  micStream = micTrack = null;
  $('audios').innerHTML = '';
  peers.clear();
  $('radio').classList.add('hidden');
  $('join').classList.remove('hidden');
});
window.addEventListener('beforeunload', () => { if (room) room.leave(); });
</script>
</body>
</html>
